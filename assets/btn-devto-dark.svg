<svg xmlns="http://www.w3.org/2000/svg" width="102" height="36" viewBox="0 0 102 36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .btn { animation: in .6s cubic-bezier(.2,.7,.2,1) 0.7s backwards; }
    .icon { transform-box: fill-box; transform-origin: center; animation: pop 6s ease-in-out 2.50s infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes pop { 0%, 8%, 100% { transform: none; } 4% { transform: scale(1.18) rotate(-6deg); } }
    @media (prefers-reduced-motion: reduce) { .btn, .icon { animation: none; } }
  </style>
  <g class="btn">
    <rect x="0.5" y="0.5" width="101" height="35" rx="17.5" fill="none" stroke="#30363d"/>
    <g class="icon"><rect x="12" y="11" width="22" height="14" rx="2.5" fill="#ffffff"/><text x="23" y="21.5" font-size="8" font-weight="800" fill="#0d1117" text-anchor="middle" letter-spacing=".3">DEV</text></g>
    <text x="42" y="23" font-size="14" font-weight="500" fill="#c9d1d9">dev.to</text>
  </g>
</svg>
