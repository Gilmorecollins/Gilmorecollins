<svg xmlns="http://www.w3.org/2000/svg" width="116" height="36" viewBox="0 0 116 36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .btn { animation: in .6s cubic-bezier(.2,.7,.2,1) 0.5s backwards; }
    .icon { transform-box: fill-box; transform-origin: center; animation: pop 6s ease-in-out 2.00s infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes pop { 0%, 8%, 100% { transform: none; } 4% { transform: scale(1.18) rotate(-6deg); } }
    @media (prefers-reduced-motion: reduce) { .btn, .icon { animation: none; } }
  </style>
  <g class="btn">
    <rect x="0.5" y="0.5" width="115" height="35" rx="17.5" fill="none" stroke="#d0d7de"/>
    <g class="icon"><rect x="14" y="10" width="16" height="16" rx="3" fill="#0A66C2"/><text x="22" y="22.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">in</text></g>
    <text x="40" y="23" font-size="14" font-weight="500" fill="#424a53">LinkedIn</text>
  </g>
</svg>
