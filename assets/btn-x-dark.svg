<svg xmlns="http://www.w3.org/2000/svg" width="68" height="36" viewBox="0 0 68 36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .btn { animation: in .6s cubic-bezier(.2,.7,.2,1) 0.6s backwards; }
    .icon { transform-box: fill-box; transform-origin: center; animation: pop 6s ease-in-out 2.25s infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes pop { 0%, 8%, 100% { transform: none; } 4% { transform: scale(1.18) rotate(-6deg); } }
    @media (prefers-reduced-motion: reduce) { .btn, .icon { animation: none; } }
  </style>
