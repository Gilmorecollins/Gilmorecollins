<svg xmlns="http://www.w3.org/2000/svg" width="126" height="36" viewBox="0 0 126 36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .btn { animation: in .6s cubic-bezier(.2,.7,.2,1) 0.8s backwards; }
    .icon { transform-box: fill-box; transform-origin: center; animation: pop 6s ease-in-out 2.75s infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes pop { 0%, 8%, 100% { transform: none; } 4% { transform: scale(1.18) rotate(-6deg); } }
    @media (prefers-reduced-motion: reduce) { .btn, .icon { animation: none; } }
  </style>
  <g class="btn">
    <rect x="0.5" y="0.5" width="125" height="35" rx="17.5" fill="none" stroke="#d0d7de"/>
    <g class="icon"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FEDA75"/><stop offset=".3" stop-color="#FA7E1E"/><stop offset=".6" stop-color="#D62976"/><stop offset="1" stop-color="#4F5BD5"/></linearGradient></defs><rect x="14" y="10" width="16" height="16" rx="4.5" fill="url(#ig)"/><circle cx="22" cy="18" r="3.6" fill="none" stroke="#ffffff" stroke-width="1.6"/><circle cx="26.2" cy="13.8" r="1" fill="#ffffff"/></g>
    <text x="40" y="23" font-size="14" font-weight="500" fill="#424a53">Instagram</text>
  </g>
</svg>
