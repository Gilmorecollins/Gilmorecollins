    @keyframes s2 { 0%, 11.56% { opacity: 0; transform: translateY(6px); } 16.56%, 86% { opacity: 1; transform: none; } 93%, 100% { opacity: 0; transform: none; } }
    @keyframes s3 { 0%, 15.11% { opacity: 0; transform: translateY(6px); } 20.11%, 86% { opacity: 1; transform: none; } 93%, 100% { opacity: 0; transform: none; } }
    @keyframes s4 { 0%, 18.67% { opacity: 0; transform: translateY(6px); } 23.67%, 86% { opacity: 1; transform: none; } 93%, 100% { opacity: 0; transform: none; } }
    @keyframes s5 { 0%, 22.22% { opacity: 0; transform: translateY(6px); } 27.22%, 86% { opacity: 1; transform: none; } 93%, 100% { opacity: 0; transform: none; } }
    @keyframes s6 { 0%, 25.78% { opacity: 0; transform: translateY(6px); } 30.78%, 86% { opacity: 1; transform: none; } 93%, 100% { opacity: 0; transform: none; } }
    @keyframes s7 { 0%, 29.33% { opacity: 0; transform: translateY(6px); } 34.33%, 86% { opacity: 1; transform: none; } 93%, 100% { opacity: 0; transform: none; } }
    @keyframes s8 { 0%, 32.89% { opacity: 0; transform: translateY(6px); } 37.89%, 86% { opacity: 1; transform: none; } 93%, 100% { opacity: 0; transform: none; } }
    @keyframes s9 { 0%, 36.44% { opacity: 0; transform: translateY(6px); } 41.44%, 86% { opacity: 1; transform: none; } 93%, 100% { opacity: 0; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .r, .s0, .s1, .s2, .s3, .s4, .s5, .s6, .s7, .s8, .s9 { animation: none; } }
  </style>

