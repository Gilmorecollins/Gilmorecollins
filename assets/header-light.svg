    .s7 { animation: s7 9s cubic-bezier(.2,.7,.2,1) infinite; }
    .s8 { animation: s8 9s cubic-bezier(.2,.7,.2,1) infinite; }
    .s9 { animation: s9 9s cubic-bezier(.2,.7,.2,1) infinite; }
    @keyframes s0 { 0%, 4.44% { opacity: 0; transform: translateY(6px); } 9.44%, 86% { opacity: 1; transform: none; } 93%, 100% { opacity: 0; transform: none; } }
